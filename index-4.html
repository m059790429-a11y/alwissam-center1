<title>وسام الشكر | مركز الوسام التعليمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@600;700&display=swap" >
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@600;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --ink:#14213d;
  --ink-soft:#2a3a63;
  --gold:#c8962b;
  --gold-deep:#8f6a14;
  --ribbon:#9e2a3a;
  --paper:#f5f7fa;
  --card:#ffffff;
  --line:#d9dfe8;
  --muted:#5b6578;
  --ok:#1f7a4d;
  --err:#b3261e;
  --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
  font-size:17px;line-height:1.75;
}
h1,h2,h3{font-family:"Noto Naskh Arabic","Traditional Arabic",serif;margin:0;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 48px}
.hero{background:var(--ink);color:#fff;padding:26px 18px 56px;text-align:center}
.hero-in{max-width:560px;margin:0 auto}
.logo{width:120px;height:120px;display:block;margin:0 auto 12px;border-radius:50%;background:#fff;border:3px solid var(--gold);object-fit:cover}
.hero h1{font-size:2rem;font-weight:700}
.hero p{margin:6px 0 0;color:#cfd7ea;font-size:1rem}
.sheet{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 18px;margin-top:-34px;box-shadow:0 10px 28px rgba(20,33,61,.08);
}
label,.lbl{display:block;font-weight:600;margin:0 0 6px}
.hint{display:block;font-weight:400;color:var(--muted);font-size:.9rem}
.field{margin-bottom:18px}
input[type=text],input[type=password],select,textarea{
  width:100%;font:inherit;color:var(--ink);background:#fff;
  border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;
}
textarea{min-height:120px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:18px 52%,12px 52%;background-size:6px 6px;background-repeat:no-repeat;padding-left:36px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,.chip input:focus-visible+span{
  outline:3px solid var(--gold);outline-offset:2px}
.chips{display:flex;gap:10px}
.chip{flex:1;position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:block;text-align:center;padding:11px;border:1.5px solid var(--line);border-radius:10px;font-weight:500;background:#fff}
.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.count{float:left;font-weight:400;color:var(--muted);font-size:.85rem}
.btn{
  width:100%;font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer;
  background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:14px;
}
.btn:hover{background:#d6a43a}
.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);width:auto;padding:8px 16px;font-size:.95rem}
.msg{margin:14px 0 0;padding:11px 14px;border-radius:10px;font-size:.95rem}
.msg.err{background:#fdecea;color:var(--err)}
.msg.ok{background:#e7f5ee;color:var(--ok)}
#studentForm{position:relative}
.hp{position:absolute;top:0;inset-inline-start:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;clip-path:inset(50%)}
.done{text-align:center;padding:14px 4px}
.done h2{font-size:1.6rem;margin:6px 0}
.done p{color:var(--muted);margin:0 0 18px}
.foot{text-align:center;margin-top:26px;font-size:.92rem}
.foot a{color:var(--muted)}
.hidden{display:none!important}

/* teacher area */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.bar h2{font-size:1.4rem}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.filters button,.filters select{font:inherit;font-size:.92rem;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.filters select{padding-left:30px;background-position:14px 52%,8px 52%}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.list{display:grid;gap:14px}
.note{background:var(--card);border:1px solid var(--line);border-right:5px solid var(--gold);border-radius:var(--radius);padding:16px}
.note-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.note-h strong{font-family:"Noto Naskh Arabic",serif;font-size:1.25rem}

.when{font-size:.85rem;color:var(--muted)}

.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.to{font-size:.88rem;color:var(--ribbon);font-weight:600;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:28px 8px}

<main class="wrap">

  <!-- Student page -->
  <section id="studentView" class="sheet">
    <form id="studentForm" novalidate>
      <div class="field">
        <label for="sName">اسمك</label>
        <input id="sName" type="text" maxlength="80" autocomplete="name" required>
      </div>

      <div class="field">
        <span class="lbl">فرعك</span>
        <div class="chips" role="radiogroup" aria-label="الفرع">
          <label class="chip"><input type="radio" name="branch" value="علمي"><span>علمي</span></label>
          <label class="chip"><input type="radio" name="branch" value="أدبي"><span>أدبي</span></label>
        </div>
      </div>

      <div class="field">
        <label for="sTeacher">المعلم الذي تشكره</label>
        <select id="sTeacher" required><option value="">جارٍ تحميل أسماء المعلمين…</option></select>
      </div>

      <div class="field">
        <label for="sDream">حلمك <span class="count" id="dreamCount">0/500</span></label>
        <textarea id="sDream" maxlength="500" style="min-height:90px"></textarea>
      </div>

      <div class="field">
        <label for="sMsg">رسالة شكر لمعلمك <span class="count" id="msgCount">0/2000</span></label>
        <textarea id="sMsg" maxlength="2000"></textarea>
      </div>

      <div class="hp" aria-hidden="true">
        <label>اترك هذا الحقل فارغاً <input id="sWebsite" type="text" tabindex="-1" autocomplete="off"></label>
      </div>

      <button class="btn" id="sendBtn" type="submit">أرسل الشكر</button>
      <div id="sMsgBox" class="msg err hidden" role="alert"></div>
    </form>

    <div id="doneBox" class="done hidden">
      <h2>وصلت رسالتك</h2>
      <p>شكراً لك. سيقرأ معلمك كلماتك.</p>
      <button class="btn ghost" id="againBtn" type="button">اكتب رسالة أخرى</button>
    </div>
  </section>

  <!-- Teacher login -->
  <section id="loginView" class="sheet hidden">
    <h2 style="margin-bottom:14px">دخول المعلمين</h2>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="uName">اسم المستخدم</label>
        <input id="uName" type="text" dir="ltr" autocapitalize="none" autocomplete="username" style="text-align:right">
      </div>
      <div class="field">
        <label for="uPass">كلمة السر</label>
        <input id="uPass" type="password" dir="ltr" autocomplete="current-password" style="text-align:right">
      </div>
      <button class="btn" id="loginBtn" type="submit">ادخل</button>
      <div id="loginErr" class="msg err hidden" role="alert"></div>
    </form>
  </section>

  <!-- Teacher dashboard -->
  <section id="boardView" class="hidden" style="margin-top:22px">
    <div class="bar">
      <h2 id="boardTitle">رسائل الطلاب</h2>
      <button class="btn ghost" id="logoutBtn" type="button">خروج</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
  </section>

  <p class="foot" id="footLink"><a href="#teacher">دخول المعلمين</a></p>
  <p class="foot hidden" id="footBack"><a href="#">العودة لصفحة الطلاب</a></p>
</main>

<script>
(function(){
  var CDNS = [
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js",
    "https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js",
    "https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/supabase.min.js"
  ];
  function loadLib(list, done){
    if (window.supabase) return done(true);
    var url = list.shift();
    if (!url) return done(false);
    var el = document.createElement("script"), finished = false;
    function next(ok){ if (finished) return; finished = true; clearTimeout(t); if (ok) done(true); else { el.remove(); loadLib(list, done); } }
    var t = setTimeout(function(){ next(false); }, 7000);
    el.onload = function(){ next(!!window.supabase); };
    el.onerror = function(){ next(false); };
    el.src = url;
    document.head.appendChild(el);
  }
  function boot(){
  const SUPABASE_URL = "https://slqhqofhqqdvehgmoana.supabase.co";

  function show(id, on){ $(id).classList.toggle("hidden", !on); }
  function setMsg(box, text){ box.textContent = text || ""; box.classList.toggle("hidden", !text); }

  /* ---------- routing ---------- */
  function route(){
    const teacher = location.hash === "#teacher";

    $("subtitle").textContent = teacher ? "لوحة المعلمين" : "مركز الوسام التعليمي";

  window.addEventListener("hashchange", route);

  async function loadTeachers(){
    const sel = $("sTeacher");
    const { data, error } = await sb.from("teachers").select("id,name").order("name");
    sel.innerHTML = "";
    if (error || !data || !data.length){
      sel.add(new Option("تعذّر تحميل أسماء المعلمين، أعد تحميل الصفحة", ""));
      return;
    }
    sel.add(new Option("اختر المعلم", ""));
    data.forEach(t => sel.add(new Option(t.name, t.id)));
  }

  function bindCounter(inputId, countId, max){
    const i = $(inputId), c = $(countId);
    const upd = () => { c.textContent = i.value.length + "/" + max; };
    i.addEventListener("input", upd); upd();
  }
  bindCounter("sDream","dreamCount",500);
  bindCounter("sMsg","msgCount",2000);

  $("studentForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const box = $("sMsgBox"); setMsg(box, "");
    if ($("sWebsite").value) return; // honeypot

    const name   = $("sName").value.trim();
    const branch = (document.querySelector('input[name="branch"]:checked') || {}).value;
    const teacher= $("sTeacher").value;
    const dream  = $("sDream").value.trim();
    const msg    = $("sMsg").value.trim();

    if (name.length < 2)  return setMsg(box, "اكتب اسمك (حرفان على الأقل).");
    if (!branch)          return setMsg(box, "اختر فرعك: علمي أو أدبي.");
    if (!teacher)         return setMsg(box, "اختر المعلم الذي تريد شكره.");
    if (dream.length < 2) return setMsg(box, "اكتب حلمك.");
    if (msg.length < 2)   return setMsg(box, "اكتب رسالة الشكر.");

    const last = Number(localStorage.getItem("lastSent") || 0);
    if (Date.now() - last < 20000) return setMsg(box, "انتظر قليلاً ثم أرسل رسالتك مرة أخرى.");

    const btn = $("sendBtn"); btn.disabled = true; btn.textContent = "جارٍ الإرسال…";
    const { error } = await sb.from("messages").insert({
      teacher_id: teacher, student_name: name, branch: branch, dream: dream, message: msg
    });
    btn.disabled = false; btn.textContent = "أرسل الشكر";

    if (error) return setMsg(box, "لم تُرسل الرسالة. تحقق من الاتصال وأعد المحاولة.");
    try { localStorage.setItem("lastSent", String(Date.now())); } catch(_){}
    show("studentForm", false); show("doneBox", true);
  });

  $("againBtn").addEventListener("click", () => {
    $("studentForm").reset();
    $("dreamCount").textContent = "0/500"; $("msgCount").textContent = "0/2000";
    show("doneBox", false); show("studentForm", true);
  });

  /* ---------- teacher area ---------- */
  async function openTeacherArea(){
    const { data } = await sb.auth.getSession();
    if (data && data.session) { showBoard(); }
    else { show("loginView", true); }
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const box = $("loginErr"); setMsg(box, "");
    const user = $("uName").value.trim().toLowerCase();
    const pass = $("uPass").value;
    if (!user || !pass) return setMsg(box, "اكتب اسم المستخدم وكلمة السر.");
    const btn = $("loginBtn"); btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: user + LOGIN_DOMAIN, password: pass });
    btn.disabled = false;
    if (error) return setMsg(box, "اسم المستخدم أو كلمة السر غير صحيحة.");
    $("uPass").value = "";
    show("loginView", false); showBoard();
  });

  $("logoutBtn").addEventListener("click", async () => {
    await sb.auth.signOut();
    show("boardView", false); show("loginView", true);
  });

  let allRows = [], branchFilter = "all", teacherFilter = "all";

  async function showBoard(){
    show("boardView", true);
    const list = $("list");
    list.replaceChildren(textNode("div","empty","جارٍ التحميل…"));
    const { data, error } = await sb.from("messages")
      .select("id,student_name,branch,dream,message,created_at,teacher_id,teachers(name)")
      .order("created_at", { ascending:false });
    if (error){ list.replaceChildren(textNode("div","empty","تعذّر تحميل الرسائل. أعد المحاولة.")); return; }
    allRows = data || [];
    branchFilter = "all"; teacherFilter = "all";
    render();
  }

  function textNode(tag, cls, text){
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    n.textContent = text;
    return n;
  }

  function render(){
    // filters
    const f = $("filters"); f.replaceChildren();
    const opts = [["all","الكل"],["علمي","علمي"],["أدبي","أدبي"]];
    opts.forEach(([val,label]) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label;
      b.setAttribute("aria-pressed", String(branchFilter === val));
      b.addEventListener("click", () => { branchFilter = val; render(); });
      f.appendChild(b);
    });
    const names = [...new Map(allRows.filter(r => r.teachers).map(r => [r.teacher_id, r.teachers.name])).entries()];
    if (names.length > 1){
      const s = document.createElement("select");
      s.setAttribute("aria-label","المعلم");
      s.add(new Option("كل المعلمين","all"));
      names.forEach(([id,n]) => s.add(new Option(n,id)));
      s.value = teacherFilter;
      s.addEventListener("change", () => { teacherFilter = s.value; render(); });
      f.appendChild(s);
    }

    const rows = allRows.filter(r =>
      (branchFilter === "all" || r.branch === branchFilter) &&
      (teacherFilter === "all" || r.teacher_id === teacherFilter));

    $("boardTitle").textContent = "رسائل الطلاب (" + rows.length + ")";
    const list = $("list"); list.replaceChildren();
    if (!rows.length){
      list.appendChild(textNode("div","empty","لا توجد رسائل بعد. عندما يكتب طالب لك سيظهر شكره هنا."));
      return;
    }
    const showTo = names.length > 1;
    rows.forEach(r => {
      const card = document.createElement("article"); card.className = "note";
      const head = document.createElement("div"); head.className = "note-h";
      const who = document.createElement("div");
      who.appendChild(textNode("strong","",r.student_name));
      who.appendChild(textNode("span","tag",r.branch));
      head.appendChild(who);
      head.appendChild(textNode("span","when",new Date(r.created_at).toLocaleDateString("ar",{year:"numeric",month:"long",day:"numeric"})));
      card.appendChild(head);
      card.appendChild(textNode("h3","","حلمه"));
      card.appendChild(textNode("p","",r.dream));
      card.appendChild(textNode("h3","","رسالة الشكر"));
      card.appendChild(textNode("p","",r.message));
      if (showTo && r.teachers) card.appendChild(textNode("div","to","إلى: " + r.teachers.name));
      list.appendChild(card);
    });
  }

  loadTeachers();
  route();
  }

  loadLib(CDNS.slice(), function(ok){
    if (ok) return boot();
    var sel = document.getElementById("sTeacher");
    sel.innerHTML = "";
    sel.add(new Option("تعذّر تحميل الصفحة، أعد المحاولة بشبكة أخرى", ""));
    var box = document.getElementById("sMsgBox");
    box.textContent = "تعذّر الاتصال بالخدمة. جرّب شبكة إنترنت أخرى (بيانات الهاتف أو واي فاي مختلف) ثم أعد تحميل الصفحة.";
    box.classList.remove("hidden");
  });
})();
</script>
</body>
</html>
